<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Rafting Adventures for reservations, inquires, or suggestions.">
    <meta name="author" content="Haremkaan Michael Torkuma">
    <title>Rafting Adventures | Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/week-logo.jpeg" alt="rafting company logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main class="contact-page">
        <section class="contact-info">
            <div class="hero" id="hero">
                <h1>White Water Rafting Company</h1>
            </div>
            <p>123 Main River Street<br>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p><a href="mailto:info@whitewater.com">info@whitewater.com</a></p>
        </section>

        <section class="contact-grid">
            <!-- Map -->
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3940.892674714483!2d7.362821799999992!3d8.982022800000001!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x104e73dd5550abc9%3A0x6f7e195c41e85151!2sGym360%20sports%20arena!5e0!3m2!1sen!2sng!4v1791825533750!5m2!1sen!2sng"
                  width="600" height="450" class="map-frame" allowfullscreen loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>

            </div>

            <!-- Form -->
            <form class="contact-form">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Placeholder" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Placeholder" required>

                <p class="form-label">Message Purpose</p>
                <label><input type="radio" name="purpose" id="general" value="general"> General
                    Inquiry</label>
                <label><input type="radio" name="purpose" id="reservation" value="reservation">
                    Reservation
                    Question</label>
                <label><input type="radio" name="purpose" id="suggestion" value="suggestion">
                    Website
                    Suggestion</label>

                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Type here"></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="newsletter" id="newsletter"> Please Subscribe me to
                    the monthly
                    newsletter
                </label>

                <button type="submit">Get In Touch!</button>
            </form>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 Rapid River Rafting | Torkuma Michael Haremkaan</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/download.png" alt="download icon"></a>
            <a href="https://www.linkedin.com">
                <img src="images/images-linkedin.jpg" alt="Linkedin social media icon"></a>
            <a href="https://www.instagram.com/">
                <img src="images/instagram.jpg" alt="Instagram social media icon"></a>
        </nav>

    </footer>

</body>

</html>
