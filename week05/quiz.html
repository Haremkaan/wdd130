<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Whitewater rafting is a type of recreation that involves navigating a non-motorized watercraft down free flowing rivers">
    <meta name="author" content="Haremkaan Michael Torkuma">
    <title>HTML & CSS QUIZ</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>HTML & CSS Fundamentals Quiz</h1>

    <!--text input-->
    <form action="#" method="post">
        <label for="q1">1. What does HTML stand for?</label>
        <input type="text" id="q1" name="q1">

        <!--Textarea-->
        <label for="q2">2. Explain the difference between inline and block elements? </label>
        <textarea id="q2" name="q2" rows="4" cols="50"></textarea>

        <!--Select dropdown-->
        <label for="q3">3. Which of the following is a valid Css property?</label>
        <select id="q3" name="q3">
            <option value="" selected disabled>Choose One..</option>
            <option value="color">color</option>
            <option value="font-size">font-size</option>
            <option value="banana">Banana</option>
        </select>

        <!--Number input-->
        <label for="q4">4.How many heading levels are available in HTML?</label>
        <input type="number" id="q4" name="q4" min="1" max="6">
        <!--submit-->
        <button type="submit">Submit Quiz</button>

    </form>

</body>

</html>
