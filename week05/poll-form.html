<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Whitewater rafting is a type of recreation that involves navigating a non-motorized watercraft down free flowing rivers">
    <meta name="author" content="Haremkaan Michael Torkuma">
    <title>HTML & CSS QUIZ</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <h1>WWD130 | HTML Form - User Poll</h1>
    </header>

    <main>
        <form>
            <fieldset>
                <legend>Tell Us About Yourself</legend>

                <!-- Full Name -->
                <div class="form-item label-narrow">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>

                <!-- Email -->
                <div class="form-item label-narrow">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Your Preferences</legend>

                <!-- Browser -->
                <div class="form-item label-wide">
                    <label for="browser">Favorite Browser:</label>
                    <select id="browser" name="browser">
                        <option value="chrome">Chrome</option>
                        <option value="firefox">Firefox</option>
                        <option value="edge">Edge</option>
                        <option value="safari">Safari</option>
                    </select>
                </div>

                <!-- Pet -->
                <div class="form-item label-wide">
                    <label for="pet">Do you own a pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                </div>

                <!-- Places Lived -->
                <div class="form-item">
                    <label for="places">Places You’ve Lived:</label>
                    <textarea id="places" name="places" rows="4"></textarea>
                </div>
            </fieldset>

            <!-- Submit Button -->
            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Haremkaan Michael Torkuma </p>
    </footer>
</body>

</html>
