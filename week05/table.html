<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Whitewater rafting is a type of recreation that involves navigating a non-motorized watercraft down free flowing rivers">
    <meta name="author" content="Haremkaan Michael Torkuma">
    <title>HTML TABlE STRUCTURE</title>
    <link rel="stylesheet" href="styles/table.css">

</head>

<body>
    <table>
        <thead>
            <tr>
                <td scope="col">League</td>
                <td scope="col">Team</td>
                <td scope="col">Record</td>
                <td scope="col">Player Count</td>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="2" scope="rowgroup">Southern</th>
                <td>Parana</td>
                <td>52-19</td>
                <td>23</td>
            </tr>
            <tr>
                <td>Catarina</td>
                <td>49-24</td>
                <td>10</td>

            </tr>
            <tr>
                <th rowspan="3" scope="rowgroup">Western</th>
                <td>Lacerda</td>
                <td>92-70</td>
                <td>27</td>
            </tr>
            <tr>
                <td>Acre</td>
                <td>75-87</td>
                <td>20</td>
            </tr>
            <tr>
                <td>Rondonia</td>
                <td>10-7</td>
                <td>12</td>
            </tr>

        </tbody>
        <tfoot>
            <tr>
                <th colspan="3" scope="row">Total Players</th>
                <td>92</td>
            </tr>
        </tfoot>

    </table>
</body>

</html>
